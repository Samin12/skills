<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Chapter Title</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --chapter-bg: #ffffff;
        --chapter-grid: #c7c7c7;
        --chapter-ink: #0b0b0d;
      }

      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: var(--chapter-bg);
      }
      body { font-family: "Inter", sans-serif; }
      #chapter-transition, #chapter-card, #chapter-canvas, #chapter-grid {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #chapter-canvas { background: var(--chapter-bg); }
      #chapter-grid {
        background-image:
          linear-gradient(to right, var(--chapter-grid) 1px, transparent 1px),
          linear-gradient(to bottom, var(--chapter-grid) 1px, transparent 1px);
        background-position: center;
        background-size: 95px 95px;
        opacity: 0.58;
        -webkit-mask-image: radial-gradient(ellipse at center, #000 0%, #000 62%, rgba(0, 0, 0, 0.7) 80%, transparent 100%);
        mask-image: radial-gradient(ellipse at center, #000 0%, #000 62%, rgba(0, 0, 0, 0.7) 80%, transparent 100%);
      }
      #chapter-content {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 120px 160px;
      }
      #chapter-mask {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 80%;
        max-width: 1536px;
        height: 150px;
        overflow: hidden;
      }
      #chapter-title {
        position: relative;
        display: inline-block;
        margin: 0;
        color: var(--chapter-ink);
        font-size: 98px;
        font-weight: 800;
        font-synthesis: none;
        letter-spacing: -0.04em;
        line-height: 0.98;
        text-align: center;
        text-rendering: geometricPrecision;
        text-shadow: 0 12px 18px rgba(0, 0, 0, 0.22);
        white-space: nowrap;
        -webkit-font-smoothing: antialiased;
      }
      .chapter-word { display: inline-block; white-space: pre; }
    </style>
  </head>
  <body>
    <main id="chapter-transition" data-composition-id="chapter-transition" data-start="0" data-duration="1.6" data-fps="30" data-width="1920" data-height="1080">
      <section id="chapter-card" class="clip" data-start="0" data-duration="1.6" data-track-index="1" aria-label="Chapter transition">
        <div id="chapter-canvas"></div>
        <div id="chapter-grid"></div>
        <div id="chapter-content">
          <div id="chapter-mask">
            <!-- Replace or add spans for the requested title. Prefix later words with &nbsp;. -->
            <h1 id="chapter-title" aria-label="Chapter Title"><span class="chapter-word" aria-hidden="true">Chapter</span><span class="chapter-word" aria-hidden="true">&nbsp;Title</span></h1>
          </div>
        </div>
      </section>
      <!-- Add a separate audio.clip element only after resolving a project-local sound file. -->
    </main>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const fps = 30;
        const frame = (number) => number / fps;
        const words = Array.from(document.querySelectorAll(".chapter-word"));
        const firstRevealFrame = 6;
        const lastRevealFrame = 19;
        const revealFrames = words.map((_, index) => {
          if (words.length === 1) return firstRevealFrame;
          return Math.round(firstRevealFrame + (index * (lastRevealFrame - firstRevealFrame)) / (words.length - 1));
        });
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#chapter-grid", { opacity: 0 }, { opacity: 0.58, duration: frame(5), ease: "power2.out" }, 0);
        tl.set(words, { autoAlpha: 0, y: 3, color: "#858585" }, 0);
        words.forEach((word, index) => {
          tl.to(word, { autoAlpha: 1, y: 0, color: "#0b0b0d", duration: frame(4), ease: "power2.out" }, frame(revealFrames[index]));
        });
        tl.to("#chapter-title", { y: -10, autoAlpha: 0, duration: frame(10), ease: "power2.in" }, frame(38));
        tl.to("#chapter-grid", { opacity: 0, duration: frame(10), ease: "power2.in" }, frame(38));
        tl.to("#chapter-canvas", { opacity: 0, duration: frame(10), ease: "power2.in" }, frame(38));
        tl.seek(0);
        window.__timelines["chapter-transition"] = tl;
      })();
    </script>
  </body>
</html>
